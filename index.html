<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12304a"><title>HVAC Invoice Manager</title><style>

px;font-weight:750;text-align:right}.invoice-paper{background:white;color:#111;padding:30px;max-width:760px;margin:auto}.invoice-paper table{width:100%;border-collapse:collapse}.invoice-paper th,.invoice-paper td{padding:9px 4px;border-bottom:1px solid #ddd;text-align:left}.invoice-paper .right{text-align:right}#printArea{display:none}footer{text-align:center;color:#64788a;font-size:12px;padding:20px}@media(max-width:580px){.grid{grid-template-columns:1fr}.itemrow{grid-template-columns:1.7fr .65fr .8fr auto}.itemrow input{padding:8px 5px;font-size:13px}.invoice-paper{padding:12px}}@media(max-width:580px){#callForm .actions button{flex:1 1 100%}#callForm input,#callForm select,#callForm textarea{font-size:16px;min-height:46px}.tabs button{min-height:44px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.invoice-paper{max-width:none;padding:0} @page{margin:16mm}}
</style></head><body><header><h1>🔧 HVAC Invoice Manager</h1><small>Free • Mobile-first • Local data</small></header><main><nav class="tabs" id="tabs"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="customers">Customers</button><button data-tab="equipment">Equipment</button><button data-tab="call">New Service Call</button><button data-tab="services">Service History</button><button data-tab="invoices">Invoices</button><button data-tab="businessProfiles">Business profiles</button><button data-tab="settings">Settings / Backup</button></nav><div id="backupNotice"></div><div id="app"></div><footer>Data stays in this browser unless you export it. Back up regularly.</footer></main><div id="printArea"></div><script>
'use strict';const KEY='hvac_invoice_manager_v1';const blank=()=>({settings:{business:'My HVAC Business',phone:'',email:'',address:'',tax:0},customers:[],equipment:[],services:[],invoices:[],nextInvoice:1});let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank();if(!db.settings||!Array.isArray(db.customers)||!Array.isArray(db.services)||!Array.isArray(db.invoices))throw Error()}catch(e){db=blank();alert('Stored data could not be read. Import a backup if you have one.')}if(!Array.isArray(db.equipment))db.equipment=[];let tab='dashboard';const $=s=>document.querySelector(s), app=$('#app');const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+(Number(n)||0).toFixed(2);const today=()=>new Date().toLocaleDateString('en-CA');const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};const serviceWhen=x=>[x.date,x.time].filter(Boolean).join(' at ');let idbHandle=null,writeQueue=Promise.resolve(),storageReady=false;
function openDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));const req=indexedDB.open('hvac_invoice_manager_storage',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('records'))d.createObjectStore('records');if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbGet(store,key){return new Promise((resolve,reject)=>{const tx=idbHandle.transaction(store,'readonly'),r=tx.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function idbPut(store,value,key){return new Promise((resolve,reject)=>{const tx=idbHandle.transaction(store,'readwrite');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);if(key===undefined)tx.objectStore(store).put(value);else tx.objectStore(store).put(value,key)})}
function idbAll(store){return new Promise((resolve,reject)=>{const tx=idbHandle.transaction(store,'readonly'),r=tx.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function validData(x){return x&&x.settings&&Array.isArray(x.customers)&&Array.isArray(x.services)&&Array.isArray(x.invoices)&&(!('equipment' in x)||Array.isArray(x.equipment))&&Number.isInteger(x.nextInvoice)}
let vaultKey=null,vaultMeta=null,locked=false;
const VAULT_META='hvac_vault_metadata_v1';
function vaultScreen(message='Enter your app password to unlock your records.'){
 locked=true;document.querySelector('#tabs').style.display='none';document.querySelector('#backupNotice').innerHTML='';app.innerHTML=`<div class="card"><h2>🔒 Unlock HVAC Invoice Manager</h2><p>${esc(message)}</p><form id="unlockForm"><label>App password<input id="unlockPassword" type="password" required autocomplete="current-password"></label><button>Unlock</button></form><p class="note">No password recovery is available. Use your separately saved encrypted backup if needed.</p></div>`;
 document.querySelector('#unlockForm').onsubmit=async e=>{e.preventDefault();await unlockVault($('#unlockPassword').value)};
}
async function encryptLocal(data,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return {format:'hvac-local-vault',version:1,iv:b64(iv),data:b64(new Uint8Array(ciphertext))}}
async function decryptLocal(wrapper,key){if(wrapper?.format!=='hvac-local-vault')throw Error('Invalid vault');return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(wrapper.iv)},key,unb64(wrapper.data))))}
async function vaultKeyFromPassword(pass,meta){return backupKey(pass,unb64(meta.salt))}
async function unlockVault(pass){try{const key=await vaultKeyFromPassword(pass,vaultMeta);const current=await idbGet('records','current');const recovered=await decryptLocal(current,key);if(!validData(recovered))throw Error('Invalid records');db=recovered;if(!Array.isArray(db.equipment))db.equipment=[];vaultKey=key;locked=false;document.querySelector('#tabs').style.display='';render();}catch(e){vaultScreen('Incorrect password, damaged data, or unavailable vault. Try again.')}}
function save(){if(locked)return false;db._updatedAt=new Date().toISOString();if(vaultMeta){if(!vaultKey||!idbHandle){alert('Encrypted storage unavailable. Export an encrypted backup.');return false}const copy=structuredClone(db);writeQueue=writeQueue.catch(()=>{}).then(async()=>idbPut('records',await encryptLocal(copy,vaultKey),'current')).catch(e=>{console.error(e);alert('Encrypted database save failed. Export a backup immediately.')});return true}
 let localOK=false;try{localStorage.setItem(KEY,JSON.stringify(db));localOK=true}catch(e){console.warn('Local mirror failed',e)}if(idbHandle){const copy=structuredClone(db);writeQueue=writeQueue.catch(()=>{}).then(()=>idbPut('records',copy,'current')).catch(e=>{console.error('IndexedDB save failed',e);alert('Database save failed. Export a backup immediately.')});return true}if(!localOK){alert('Could not save locally. Export a backup now.');return false}return true}
async function initializeStorage(){try{idbHandle=await openDatabase();const stored=await idbGet('records','current');vaultMeta=JSON.parse(localStorage.getItem(VAULT_META)||'null');if(stored?.format==='hvac-local-vault'){if(!vaultMeta){vaultScreen('Encrypted records found but vault metadata is missing. Restore a separate encrypted backup if necessary.');return}vaultScreen();return}if(vaultMeta){vaultScreen('Vault metadata found but encrypted records are missing. Restore a separate backup.');return}
 const legacyHasData=db.customers.length||db.services.length||db.invoices.length;const storedTime=Date.parse(stored?._updatedAt||0)||0,localTime=Date.parse(db._updatedAt||0)||0;if(validData(stored)&&(!legacyHasData||storedTime>localTime)){db=stored;if(!Array.isArray(db.equipment))db.equipment=[]}else if(legacyHasData||!stored){await idbPut('records',structuredClone(db),'current')}else{db=stored;if(!Array.isArray(db.equipment))db.equipment=[]}storageReady=true;render()}catch(e){console.warn('IndexedDB unavailable',e);if(localStorage.getItem(VAULT_META)){vaultScreen('Encrypted storage is unavailable in this browser.');return}storageReady=false;render()}}
async function enableVault(){if(vaultMeta){alert('Local encryption is already enabled.');return}if(!idbHandle||!crypto?.subtle){alert('Encrypted storage requires IndexedDB and HTTPS.');return}const pass=$('#vaultPass').value,confirmPass=$('#vaultConfirm').value;if(pass.length<12||pass!==confirmPass){alert('Enter matching passwords of at least 12 characters.');return}if(!confirm('First save a separate encrypted backup and verify it. Continue enabling encrypted local storage?'))return;
 try{await writeQueue;const salt=crypto.getRandomValues(new Uint8Array(16));const meta={version:1,salt:b64(salt)};const key=await vaultKeyFromPassword(pass,meta);const wrapped=await encryptLocal(structuredClone(db),key);await idbPut('records',wrapped,'current');localStorage.setItem(VAULT_META,JSON.stringify(meta));vaultMeta=meta;vaultKey=key;localStorage.removeItem(KEY);await clearSnapshots();alert('Local records encrypted. Existing downloaded JSON/CSV files and browser/device copies are NOT secured by this change. Keep your password and an encrypted backup safe.');settings()}catch(e){alert('Could not enable encryption: '+e.message)}}
function lockApp(){if(!vaultMeta)return;vaultKey=null;db=blank();vaultScreen()}
async function clearSnapshots(){if(!idbHandle)return;await new Promise((resolve,reject)=>{const tx=idbHandle.transaction('snapshots','readwrite');tx.objectStore('snapshots').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function downloadFile(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function backupPayload(){return JSON.stringify({...db,_backupFormat:'hvac-v2',_exportedAt:new Date().toISOString()},null,2)}
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=bytes=>btoa(String.fromCharCode(...bytes));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function backupKey(password,salt){const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptBackup(password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await backupKey(password,salt);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(backupPayload()));return JSON.stringify({format:'hvac-encrypted-backup',version:1,kdf:'PBKDF2-SHA256',iterations:310000,cipher:'AES-256-GCM',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(encrypted))},null,2)}
async function decryptBackup(wrapper,password){if(wrapper.format!=='hvac-encrypted-backup'||wrapper.version!==1||wrapper.kdf!=='PBKDF2-SHA256'||wrapper.iterations!==310000||wrapper.cipher!=='AES-256-GCM')throw Error('Unsupported encrypted backup format');const salt=unb64(wrapper.salt),iv=unb64(wrapper.iv),data=unb64(wrapper.data);if(salt.length!==16||iv.length!==12||data.length<17)throw Error('Invalid encrypted backup');const key=await backupKey(password,salt);try{return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data)))}catch(e){throw Error('Wrong password or damaged backup file')}}
async function exportEncrypted(){if(!crypto?.subtle){alert('Encryption requires a secure HTTPS page or localhost.');return}const pass=$('#encryptPass')?.value||'',again=$('#encryptConfirm')?.value||'';if(pass.length<12){alert('Use a backup password of at least 12 characters.');return}if(pass!==again){alert('Passwords do not match.');return}try{const result=await encryptBackup(pass);downloadFile(`hvac-encrypted-${today()}.hvacbackup`,result,'application/json');$('#encryptPass').value='';$('#encryptConfirm').value='';alert('Encrypted backup download requested. Verify it appears in Files/Downloads, and test restoring it before relying on it. Keep your password safe: it cannot be recovered.');}catch(e){alert('Encryption failed: '+e.message)}}
async function snapshotBackup(){if(vaultMeta){alert('Plaintext local snapshots are disabled when encrypted storage is enabled. Download an encrypted backup instead.');return}if(!idbHandle){alert('Local backup history requires IndexedDB. Export a JSON file instead.');return}try{await writeQueue;const item={id:new Date().toISOString()+'-'+Math.random().toString(36).slice(2,6),date:new Date().toISOString(),data:structuredClone(db)};await idbPut('snapshots',item);const all=(await idbAll('snapshots')).sort((a,b)=>b.date.localeCompare(a.date));for(const old of all.slice(15))await new Promise((resolve,reject)=>{const tx=idbHandle.transaction('snapshots','readwrite');tx.objectStore('snapshots').delete(old.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});alert('Local snapshot saved. Also export a JSON file to protect against device loss.');settings()}catch(e){alert('Snapshot failed: '+e.message)}}
async function showSnapshots(){if(vaultMeta){alert('Local snapshots are disabled in encrypted mode.');return}if(!idbHandle){alert('Backup history is unavailable on this browser.');return}const list=(await idbAll('snapshots')).sort((a,b)=>b.date.localeCompare(a.date));const el=document.querySelector('#snapshotList');if(!el)return;el.innerHTML=list.map((x,i)=>`<div class="listitem row"><span>${esc(new Date(x.date).toLocaleString())}</span><button class="secondary" onclick="restoreSnapshot(${i})">Restore</button></div>`).join('')||'<p class="muted">No snapshots yet.</p>';window._snapshotList=list}
async function restoreSnapshot(i){const x=window._snapshotList?.[i];if(!x||!validData(x.data))return;if(!confirm('Replace current records with this snapshot? Export a current backup first.'))return;const previous=db;db=structuredClone(x.data);if(!Array.isArray(db.equipment))db.equipment=[];if(save()){await writeQueue;alert('Snapshot restored.');go('dashboard')}else db=previous}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function csvExport(kind){let cols,rows;if(kind==='customers'){cols=['Name','Phone','Email','Address'];rows=db.customers.map(x=>[x.name,x.phone,x.email,x.address])}else if(kind==='equipment'){cols=['Customer','Type','Manufacturer','Model','Serial','Refrigerant','Installed','Warranty','Notes'];rows=db.equipment.map(x=>[customer(x.customerId)?.name,x.type,x.make,x.model,x.serial,x.refrigerant,x.installed,x.warranty,x.notes])}else if(kind==='services'){cols=['Date','Time','Customer','Equipment','Work','Parts','Hours','Job type'];rows=db.services.map(x=>[x.date,x.time||'',customer(x.customerId)?.name,unit(x.equipmentId)?unitName(unit(x.equipmentId)):x.equipment,x.work,x.parts,x.hours,x.jobType])}else{cols=['Invoice','Date','Due','Customer','Subtotal','Total','Status','Paid date'];rows=db.invoices.map(x=>[x.number,x.date,x.due,x.customerSnapshot?.name||customer(x.customerId)?.name,x.subtotal,x.total,x.paid?'Paid':'Unpaid',x.paidDate])}downloadFile('hvac-'+kind+'-'+today()+'.csv','\ufeff'+[cols,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backupReminder(){const last=localStorage.getItem('hvac_last_export');const days=last?(Date.now()-Date.parse(last))/86400000:Infinity;if(days>=1){const el=document.querySelector('#backupNotice');if(el)el.innerHTML='<div class="card"><b>Backup reminder</b><p>Export your records today and save the file somewhere private, away from this device.</p><button onclick="exportData()">Export backup now</button></div>'}}
const customer=id=>db.customers.find(x=>x.id===id);const unit=id=>(db.equipment||[]).find(x=>x.id===id);const svc=id=>db.services.find(x=>x.id===id);const invoice=id=>db.invoices.find(x=>x.id===id);const val=(f,k)=>String(new FormData(f).get(k)||'').trim();const opts=(items,selected='')=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');const cOptions=(selected='')=>`<option value="">Choose customer</option>`+opts(db.customers,selected);const field=(label,name,value='',type='text',required=false)=>`<label>${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;function go(t){tab=t;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});function render(){migrateOntario();({dashboard,customers,equipment:equipmentPage,call:serviceCall,services,invoices,settings,businessProfiles})[tab]()}function dashboard(){backupReminder();let unpaid=db.invoices.filter(x=>!x.paid);app.innerHTML=`<h2>Business overview</h2><div class="grid"><div class="card"><div class="muted">Unpaid invoices</div><div class="stat">${unpaid.length}</div></div><div class="card"><div class="muted">Outstanding balance</div><div class="stat">${money(unpaid.reduce((a,x)=>a+x.total,0))}</div></div><div class="card"><div class="muted">Customers</div><div class="stat">${db.customers.length}</div></div><div class="card"><div class="muted">Completed service records</div><div class="stat">${db.services.length}</div></div></div><div class="actions"><button onclick="go('customers')">+ Customer</button><button onclick="go('equipment')">+ Equipment</button><button onclick="go('call')">+ Service Call</button><button onclick="go('invoices')">+ Invoice</button></div><div class="card"><h3>Recent invoices</h3>${db.invoices.slice().reverse().slice(0,5).map(x=>`<div class="listitem row"><div><b>${esc(x.number)}</b> — ${esc(customer(x.customerId)?.name||'Unknown')}<div class="muted">${esc(x.date)}</div></div><div>${money(x.total)} <span class="pill ${x.paid?'paid':''}">${x.paid?'Paid':'Unpaid'}</span></div></div>`).join('')||'<p class="muted">No invoices yet.</p>'}</div>`}
function customers(){app.innerHTML=`<div class="row"><h2>Customers</h2><button onclick="editCustomer()">+ Add</button></div><div class="card"><input id="customerSearch" placeholder="Search customers" oninput="listCustomers(this.value)"><div id="customerList"></div></div>`;listCustomers('')}function listCustomers(q){$('#customerList').innerHTML=db.customers.filter(x=>(x.name+' '+x.phone+' '+x.address).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="listitem"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} ${esc(x.email)}</div><div class="muted">${esc(x.address)}</div></div><button class="secondary" onclick="editCustomer('${x.id}')">Edit</button></div></div>`).join('')||'<p class="muted">No matching customers.</p>'}function editCustomer(cid){const x=customer(cid)||{};app.innerHTML=`<h2>${cid?'Edit':'New'} customer</h2><form id="customerForm" class="card">${field('Customer name','name',x.name,true?'text':'text',true)}${field('Phone','phone',x.phone,'tel')}${field('Email','email',x.email,'email')}${field('Service address','address',x.address)}<div class="actions"><button type="submit">Save customer</button><button type="button" class="secondary" onclick="go('customers')">Cancel</button>${cid?`<button type="button" class="danger" onclick="deleteCustomer('${cid}')">Delete</button>`:''}</div></form>`;$('#customerForm').onsubmit=e=>{e.preventDefault();const f=e.target;const obj={id:cid||id(),name:val(f,'name'),phone:val(f,'phone'),email:val(f,'email'),address:val(f,'address')};if(cid)Object.assign(customer(cid),obj);else db.customers.push(obj);if(save())go('customers')}}function deleteCustomer(cid){if(db.services.some(x=>x.customerId===cid)||db.invoices.some(x=>x.customerId===cid)||db.equipment.some(x=>x.customerId===cid)){alert('Customer has equipment, service or invoice history and cannot be deleted.');return}if(confirm('Delete customer?')){db.customers=db.customers.filter(x=>x.id!==cid);save();go('customers')}}
function unitName(x){return [x.type,x.make,x.model,x.serial&&'S/N '+x.serial].filter(Boolean).join(' · ')||'Equipment'}
function unitChoices(customerId,selected=''){return '<option value="">No saved equipment / manual description</option>'+db.equipment.filter(x=>x.customerId===customerId).map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(unitName(x))}</option>`).join('')}
function updateUnitSelect(form,selected=''){const c=form.elements.customerId.value,sel=form.elements.equipmentId;if(!sel)return;sel.innerHTML=unitChoices(c,selected);if(!selected)sel.value=''}
function unitSection(record={}){return `<label>Saved equipment (optional)<select name="equipmentId">${unitChoices(record.customerId||'',record.equipmentId||'')}</select></label>`}
function customerUnitChange(form,selected=''){updateUnitSelect(form,selected)}
function equipmentPage(){app.innerHTML=`<div class="row"><h2>Customer equipment</h2><button onclick="editEquipment()">+ Add unit</button></div><p class="muted">Track individual HVAC and refrigeration units and see their service history.</p><div class="card"><input id="unitSearch" placeholder="Search customer, type, make, model or serial" oninput="listEquipment(this.value)"><div id="unitList"></div></div>`;listEquipment('')}
function listEquipment(search=''){const q=search.toLowerCase(),items=(db.equipment||[]).filter(x=>[customer(x.customerId)?.name,x.type,x.make,x.model,x.serial,x.refrigerant].join(' ').toLowerCase().includes(q));$('#unitList').innerHTML=items.map(x=>`<div class="listitem"><div class="row"><div><b>${esc(unitName(x))}</b><div class="muted">${esc(customer(x.customerId)?.name||'Unknown customer')}${x.refrigerant?' · '+esc(x.refrigerant):''}</div></div><button class="secondary" onclick="showEquipment('${x.id}')">Open</button></div></div>`).join('')||'<p class="muted">No equipment found. Add a unit to start tracking it.</p>'}
function editEquipment(uid){if(!db.customers.length){alert('Add a customer first.');go('customers');return}const x=unit(uid)||{};app.innerHTML=`<h2>${uid?'Edit':'Add'} equipment</h2><form class="card" id="unitForm"><label>Customer<select name="customerId" required>${cOptions(x.customerId)}</select></label><div class="grid">${field('Equipment type','type',x.type||'','text',true)}${field('Manufacturer / brand','make',x.make)}${field('Model','model',x.model)}${field('Serial number','serial',x.serial)}${field('Refrigerant','refrigerant',x.refrigerant)}${field('Installation date','installed',x.installed,'date')}${field('Warranty expiration','warranty',x.warranty,'date')}</div><label>Location / notes<textarea name="notes">${esc(x.notes)}</textarea></label><div class="actions"><button>Save equipment</button><button type="button" class="secondary" onclick="go('equipment')">Cancel</button>${uid?`<button type="button" class="danger" onclick="deleteEquipment('${uid}')">Delete</button>`:''}</div></form>`;$('#unitForm').onsubmit=e=>{e.preventDefault();const f=e.target,o={id:uid||id(),customerId:val(f,'customerId'),type:val(f,'type'),make:val(f,'make'),model:val(f,'model'),serial:val(f,'serial'),refrigerant:val(f,'refrigerant'),installed:val(f,'installed'),warranty:val(f,'warranty'),notes:val(f,'notes')};if(uid){if(db.services.some(s=>s.equipmentId===uid&&s.customerId!==o.customerId)){alert('Cannot move equipment to another customer while linked service history exists.');return}Object.assign(unit(uid),o)}else db.equipment.push(o);if(save())showEquipment(o.id)}}

function services(){app.innerHTML=`<div class="row"><h2>Service history</h2><button onclick="editService()">+ Add</button></div><div class="card">${db.services.slice().reverse().map(x=>`<div class="listitem row"><div><b>${esc(customer(x.customerId)?.name||'Unknown')}</b><div>${esc(unit(x.equipmentId)?unitName(unit(x.equipmentId)):(x.equipment||'Service call'))} — ${esc(serviceWhen(x))}</div><div class="muted">${esc(x.work)}</div></div><div class="actions"><button class="secondary" onclick="editService('${x.id}')">Edit</button><button onclick="invoiceFromCall('${x.id}')">Invoice</button></div></div>`).join('')||'<p class="muted">No service records.</p>'}</div>`}function editService(sid){if(!db.customers.length){alert('Add a customer first.');go('customers');return}const x=svc(sid)||{};app.innerHTML=`<h2>${sid?'Edit':'New'} service record</h2><form class="card" id="serviceForm"><label>Customer<select name="customerId" onchange="customerUnitChange(this.form)" required>${cOptions(x.customerId)}</select></label><div class="grid">${field('Service date','date',x.date||today(),'date',true)}${field('Service time','time',x.time??(sid?'':nowTime()),'time')}</div>${unitSection(x)}${field('Equipment / model / serial','equipment',x.equipment)}<label>Work performed<textarea name="work">${esc(x.work)}</textarea></label><label>Parts / refrigerant used<textarea name="parts">${esc(x.parts)}</textarea></label>${field('Labor hours','hours',x.hours||'','number')}<div class="actions"><button>Save service</button><button type="button" class="secondary" onclick="go('services')">Cancel</button>${sid?`<button type="button" class="danger" onclick="deleteService('${sid}')">Delete</button>`:''}</div></form>`;$('#serviceForm').onsubmit=e=>{e.preventDefault();const f=e.target;const chosen=unit(val(f,'equipmentId'));if(chosen&&chosen.customerId!==val(f,'customerId')){alert('Equipment belongs to a different customer.');return}const o={id:sid||id(),customerId:val(f,'customerId'),date:val(f,'date'),ti function serviceCall(){
 if(!db.customers.length){app.innerHTML=`<h2>New service call</h2><div class="card"><p>Add your first customer before recording a service call.</p><button onclick="editCustomer()">+ Add customer</button></div>`;return}
 app.innerHTML=`<h2>New service call</h2><p class="muted">Record the job once, then create its invoice in one tap.</p><form id="callForm" class="card"><label>Customer<select name="customerId" onchange="customerUnitChange(this.form)" required>${cOptions()}</select></label><div class="grid">${field('Service date','date',today(),'date',true)}${field('Service time','time',nowTime(),'time',true)}<label>Job type<select name="jobType"><option>Repair</option><option>Maintenance</option><option>Installation</option><option>Diagnostic</option><option>Emergency call</option><option>Other</option></select></label></div>${unitSection()}${field('Equipment / make / model / serial','equipment')}<label>Work performed<textarea name="work" required placeholder="Describe the problem, diagnosis, and completed work"></textarea></label><label>Parts / refrigerant used<textarea name="parts" placeholder="Part numbers, refrigerant type and quantity"></textarea></label><div class="grid">${field('Labor hours','hours','1','number',true)}${field('Hourly rate ($)','rate','0','number',true)}${field('Parts and materials ($)','materials','0','number',true)}${field('Service call fee ($)','fee','0','number',true)}</div><div class="card" style="background:#f2f6f9"><div class="muted">Estimated subtotal (before tax)</div><div class="stat" id="callTotal">$0.00</div></div><div class="actions"><button type="submit" name="action" value="invoice">Save & create invoice</button><button type="submit" name="action" value="save" class="secondary">Save service only</button><button type="button" class="secondary" onclick="go('dashboard')">Cancel</button></div></form>`;
 const form=$('#callForm');const calc=()=>{$('#callTotal').textContent=money((+val(form,'hours')||0)*(+val(form,'rate')||0)+(+val(form,'materials')||0)+(+val(form,'fee')||0))};form.addEventListener('input',calc);calc();
 form.onsubmit=e=>{e.preventDefault();const f=e.target;const action=e.submitter?.value||'save';const hours=+val(f,'hours'),rate=+val(f,'rate'),materials=+val(f,'materials'),fee=+val(f,'fee');if([hours,rate,materials,fee].some(n=>!Number.isFinite(n)||n<0)){alert('Amounts and hours must be zero or greater.');return}const chosen=unit(val(f,'equipmentId'));if(chosen&&chosen.customerId!==val(f,'customerId')){alert('Equipment belongs to a different customer.');return}const record={id:id(),customerId:val(f,'customerId'),date:val(f,'date'),time:val(f,'time'),jobType:val(f,'jobType'),equipmentId:val(f,'equipmentId'),equipment:val(f,'equipment'),work:val(f,'work'),parts:val(f,'parts'),hours:String(hours),rate,materials,fee};db.services.push(record);if(!save()){db.services.pop();return}if(action==='invoice')invoiceFromCall(record.id);else go('services')};

function invoiceFromCall(sid){const s=svc(sid);if(!s)return;editInvoice();const f=$('#invoiceForm');if(!f)return;f.elements.customerId.value=s.customerId;f.elements.serviceId.value=s.id;f.elements.date.value=s.date;const lines=[];if(s.fee>0)lines.push({desc:'Service call fee',qty:1,price:s.fee});if(Number(s.hours)>0)lines.push({desc:'Labor — '+(s.jobType||'HVAC service'),qty:Number(s.hours),price:Number(s.rate)||0});if(s.materials>0)lines.push({desc:'Parts / refrigerant — '+(s.parts||'materials'),qty:1,price:s.materials});if(!lines.length)lines.push({desc:'HVAC service — '+s.work,qty:1,price:0});$('#lines').innerHTML='';lines.forEach(addLine);f.elements.notes.value=[(s.equipmentId&&unit(s.equipmentId)?'Equipment: '+unitName(unit(s.equipmentId)):s.equipment&&'Equipment: '+s.equipment),s.work&&'Work: '+s.work,s.parts&&'Parts: '+s.parts,s.time&&'Service time: '+s.time].filter(Boolean).join('\n');recalc();}
function invoices(){app.innerHTML=`<div class="row"><h2>Invoices</h2><button onclick="editInvoice()">+ Create</button></div><div class="card">${db.invoices.slice().reverse().map(x=>`<div class="listitem"><div class="row"><div><b>${esc(x.number)}</b> — ${esc(customer(x.customerId)?.name||x.customerSnapshot?.name||'Unknown')}<div class="muted">${esc(x.date)} · ${money(x.total)} · <span class="pill ${x.paid?'paid':''}">${x.paid?'Paid':'Unpaid'}</span></div></div><button class="secondary" onclick="viewInvoice('${x.id}')">Open</button></div></div>`).join('')||'<p class="muted">No invoices yet.</p>'}</div>`}function lineRow(x={}){return `<div class="itemrow"><input aria-label="Description" placeholder="Description" class="desc" value="${esc(x.desc)}" required><input aria-label="Quantity" type="number" min="0" step="0.01" placeholder="Qty" class="qty" value="${esc(x.qty??1)}" required><input aria-label="Unit price" type="number" min="0" step="0.01" placeholder="$ each" class="price" value="${esc(x.price??0)}" required><button type="button" class="danger" onclick="this.parentElement.remove();recalc()">×</button></div>`}function addLine(x){$('#lines').insertAdjacentHTML('beforeend',lineRow(x));recalc()}function recalc(){let sum=0;document.querySelectorAll('#lines .itemrow').forEach(r=>sum+=(+r.querySelector('.qty').value||0)*(+r.querySelector('.price').value||0));const tax=+($('#tax')?.value||0);if($('#calc'))$('#calc').textContent=`Subtotal ${money(sum)} · Tax ${money(sum*tax/100)} · Total ${money(sum*(1+tax/100))}`}
function editInvoice(iid){if(!db.customers.length){alert('Add a customer first.');go('customers');return}const x=invoice(iid)||{};app.innerHTML=`<h2>${iid?'Edit':'Create'} invoice</h2><form class="card" id="invoiceForm"><label>Customer<select name="customerId" required>${cOptions(x.customerId)}</select></label><label>Link service record (optional)<select name="serviceId"><option value="">No linked service</option>${db.services.map(s=>`<option value="${esc(s.id)}" ${s.id===x.serviceId?'selected':''}>${esc(customer(s.customerId)?.name||'Unknown')} — ${esc(s.date)} — ${esc(s.equipment)}</option>`).join('')}</select></label><div class="grid">${field('Invoice date','date',x.date||today(),'date',true)}${field('Due date','due',x.due||today(),'date',true)}</div><h3>Charges</h3><p class="muted">Description / Quantity / Price</p><div id="lines"></div><button type="button" class="secondary" onclick="addLine()">+ Add charge</button><label>Tax percentage<input id="tax" name="tax" type="number" min="0" max="100" step="0.01" value="${esc(x.tax??db.settings.tax)}" oninput="recalc()"></label><label>Notes<textarea name="notes">${esc(x.notes)}</textarea></label><div class="total" id="calc"></div><div class="actions"><button type="submit">Save invoice</button><button type="button" class="secondary" onclick="go('invoices')">Cancel</button></div></form>`;(x.lines?.length?x.lines:[{desc:'Service call / labor',qty:1,price:0}]).forEach(addLine);$('#lines').addEventListener('input',recalc);$('#invoiceForm').onsubmit=e=>{e.preventDefault();const f=e.target;const lines=[...$('#lines').querySelectorAll('.itemrow')].map(r=>({desc:r.querySelector('.desc').value.trim(),qty:+r.querySelector('.qty').value,price:+r.querySelector('.price').value}));if(!lines.length||lines.some(l=>!l.desc||l.qty<=0||l.price<0)){alert('Add at least one valid charge.');return}const customerId=val(f,'customerId'),serviceId=val(f,'serviceId');if(serviceId&&svc(serviceId)?.customerId!==customerId){alert('The linked service belongs to another customer.');return}const tax=+val(f,'tax'),subtotal=lines.reduce((s,l)=>s+l.qty*l.price,0),total=Math.round((subtotal*(1+tax/100)+Number.EPSILON)*100)/100;const o={id:iid||id(),number:x.number||`INV-${String(db.nextInvoice).padStart(5,'0')}`,customerId,customerSnapshot:{...customer(customerId)},serviceId,date:val(f,'date'),due:val(f,'due'),tax,notes:val(f,'notes'),lines,subtotal,total,paid:x.paid||false,paidDate:x.paidDate||''};if(iid)Object.assign(invoice(iid),o);else{db.invoices.push(o);db.nextInvoice++}if(save())viewInvoice(o.id)}}
function invoiceHTML(x){const c=x.customerSnapshot||customer(x.customerId)||{},b=db.settings;const tax=x.total-x.subtotal;return `<div class="invoice-paper"><div class="row"><div><h1 style="margin:0">${esc(b.business)}</h1><div>${esc(b.address)}</div><div>${esc(b.phone)} ${esc(b.email)}</div></div><div style="text-align:right"><h1>INVOICE</h1><b>${esc(x.number)}</b><div>${x.paid?'PAID':'UNPAID'}</div></div></div><hr><div class="grid"><div><b>Bill to</b><div>${esc(c.name)}</div><div>${esc(c.address)}</div><div>${esc(c.phone)}</div><div>${esc(c.email)}</div></div><div><b>Invoice date:</b> ${esc(x.date)}<div><b>Due:</b> ${esc(x.due)}</div></div></div><table><thead><tr><th>Description</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Amount</th></tr></thead><tbody>${x.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td class="right">${esc(l.qty)}</td><td class="right">${money(l.price)}</td><td class="right">${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div style="text-align:right;margin-top:18px">Subtotal: ${money(x.subtotal)}<div>Tax (${esc(x.tax)}%): ${money(x.total-x.subtotal)}</div><h2>Total: ${money(x.total)}</h2></div>${x.notes?`<p><b>Notes:</b> ${esc(x.notes)}</p>`:''}<p style="margin-top:35px">Thank you for your business!</p></div>`}function viewInvoice(iid){const x=invoice(iid);if(!x){go('invoices');return}app.innerHTML=`<div class="row"><h2>${esc(x.number)}</h2><span class="pill ${x.paid?'paid':''}">${x.paid?'Paid':'Unpaid'}</span></div><div class="actions"><button onclick="printInvoice('${iid}')">Print / Save PDF</button><button class="secondary" onclick="emailInvoice('${iid}')">Prepare email</button><button class="secondary" onclick="togglePaid('${iid}')">Mark ${x.paid?'unpaid':'paid'}</button><button class="secondary" onclick="editInvoice('${iid}')">Edit</button><button class="danger" onclick="deleteInvoice('${iid}')">Delete</button><button class="secondary" onclick="go('invoices')">Back</button></div><div class="card" style="overflow:auto">${invoiceHTML(x)}</div><p class="note">Email opens your mail app with invoice details. To attach a PDF, first save it using Print / Save PDF, then attach the saved file manually.</p>`}function printInvoice(iid){const x=invoice(iid);$('#printArea').innerHTML=invoiceHTML(x);window.print()}function emailInvoice(iid){const x=invoice(iid),c=x.customerSnapshot||customer(x.customerId)||{},b=db.settings;const subject=`Invoice ${x.number} from ${b.business}`;const body=`Hello ${c.name||''},\n\nThank you for your business.\n\nInvoice: ${x.number}\nDate: ${x.date}\nDue: ${x.due}\nTotal: ${money(x.total)}\nStatus: ${x.paid?'Paid':'Unpaid'}\n\nPlease see the attached invoice PDF (attach it manually if needed).\n\n${b.business}\n${b.phone}`;location.href=`mailto:${encodeURIComponent(c.email||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}function togglePaid(iid){const x=invoice(iid);x.paid=!x.paid;x.paidDate=x.paid?today():'';save();viewInvoice(iid)}function deleteInvoice(iid){if(confirm('Permanently delete this invoice? This may create a gap in invoice numbering.')){db.invoices=db.invoices.filter(x=>x.id!==iid);save();go('invoices')}}
function settings(){const x=db.settings;app.innerHTML=`<h2>Business settings</h2><form class="card" id="settingsForm">${field('Business name','business',x.business,'text',true)}${field('Phone','phone',x.phone,'tel')}${field('Email','email',x.email,'email')}${field('Business address','address',x.address)}${field('Default tax (%)','tax',x.tax,'number')}<button>Save settings</button></form><div class="card"><h3>Data protection</h3><p class="note">IndexedDB: ${idbHandle?'Available':'Unavailable — using original browser storage'}. Existing localStorage data is retained as a compatibility copy. Neither browser store survives all device resets or storage clearing.</p><div class="actions"><button onclick="exportData()">Download UNENCRYPTED JSON backup</button><button class="secondary" onclick="snapshotBackup()">Save local snapshot</button><button class="secondary" onclick="showSnapshots()">View local history</button></div><div class="card"><h3>Encrypted backup (recommended)</h3><p class="note">AES-256-GCM encryption with a password-derived key. Password is never saved. Use a unique password of 12+ characters and keep it in a safe place. Without it, your backup cannot be recovered.</p><label>Backup password<input id="encryptPass" type="password" autocomplete="new-password" minlength="12"></label><label>Confirm password<input id="encryptConfirm" type="password" autocomplete="new-password" minlength="12"></label><button type="button" onclick="exportEncrypted()">Download encrypted backup</button></div><div id="snapshotList"></div><label>Restore JSON or encrypted backup<input type="file" id="backupFile" accept=".json,.hvacbackup,application/json"></label><label>Encrypted backup password (only for encrypted files)<input id="restorePass" type="password" autocomplete="off"></label><button class="secondary" onclick="importData()">Restore backup file</button></div><div class="card"><h3>Excel / CSV exports</h3><div class="actions"><button class="secondary" onclick="csvExport('customers')">Customers CSV</button><button class="secondary" onclick="csvExport('services')">Service history CSV</button><button class="secondary" onclick="csvExport('equipment')">Equipment CSV</button><button class="secondary" onclick="csvExport('invoices')">Invoices CSV</button></div><p class="note">CSV files are for reporting, not complete restoration. Use JSON for full backups.</p></div><div class="card"><h3>Phone ↔ computer transfer and Google Drive</h3><p>1. Download a full JSON backup. 2. Save it in a private Google Drive folder (or transfer it directly to your other device). 3. Open this app on the other device and restore that file. 4. Repeat after changes. This is manual transfer, not automatic two-way sync.</p><p class="note">Never put customer backups in a public GitHub repository. Keep only one device as your primary editor to avoid overwriting newer work. Google Drive upload requires you to sign in separately; this app does not request cloud access.</p></div><div class="card"><h3>App lock and encrypted local records</h3><p class="note">${vaultMeta?'Enabled: records are encrypted in IndexedDB and locked after a reload.':'Not enabled: records are stored unencrypted in this browser.'}</p>${vaultMeta?'<button type="button" onclick="lockApp()">Lock app now</button>':'<label>New app password (12+ characters)<input id="vaultPass" type="password" autocomplete="new-password"></label><label>Confirm app password<input id="vaultConfirm" type="password" autocomplete="new-password"></label><button type="button" onclick="enableVault()">Enable encrypted local storage</button>'}</div><div class="card"><h3>Privacy</h3><p class="muted">Local records are encrypted only after you enable the app lock. Existing backups and CSV exports remain unencrypted unless explicitly encrypted. Local snapshots are disabled in encrypted mode. Unencrypted JSON/CSV exports remain available. Use a device lock and private account. Export backups off-device daily. No cloud auto-sync or scheduled background backup is included.</p></div>`;$('#settingsForm').onsubmit=e=>{e.preventDefault();const f=e.target;db.settings={business:val(f,'business'),phone:val(f,'phone'),email:val(f,'email'),address:val(f,'address'),tax:Math.max(0,Math.min(100,+val(f,'tax')||0))};if(save())alert('Settings saved')}}
function exportData(){downloadFile(`hvac-backup-${today()}.json`,backupPayload(),'application/json');try{localStorage.setItem('hvac_last_export',new Date().toISOString())}catch(e){}const notice=$('#backupNotice');if(notice)notice.innerHTML='';}
async function importData(){const file=$('#backupFile').files[0];if(!file){alert('Choose a backup file first.');return}try{let x=JSON.parse(await file.text());if(x.format==='hvac-encrypted-backup'){if(!crypto?.subtle)throw Error('Encrypted restore requires HTTPS or localhost');const pass=$('#restorePass').value;if(!pass)throw Error('Enter your encrypted backup password');x=await decryptBackup(x,pass)}if(!validData(x)||!Number.isInteger(x.nextInvoice))throw Error('Invalid backup structure');if(!confirm('Replace ALL current records with this backup? Export your current data first.'))return;const previous=db;db=x;if(!Array.isArray(db.equipment))db.equipment=[];if(!save()){db=previous;return}await writeQueue;$('#restorePass').value='';alert('Backup restored. Verify your customers, services and invoices.');go('dashboard')}catch(e){alert('Could not import backup: '+e.message)}}function migrateOntario(){if(db.schemaVersion>=2&&Array.isArray(db.businesses))return;const old=db.settings||{};db.businesses=[{id:'hvac',type:'hvac',legalName:old.business||'My HVAC Business',operatingName:old.business||'',phone:old.phone||'',email:old.email||'',address:old.address||'',hstNumber:'',hstRegistered:false,defaultHstRate:13},{id:'property',type:'property',legalName:'Commercial Property Business',operatingName:'',phone:'',email:'',address:'',hstNumber:'',hstRegistered:false,defaultHstRate:13}];db.activeBusinessId='hvac';db.schemaVersion=2;db.property={properties:[],units:[],tenants:[],leases:[],rentInvoices:[],payments:[],expenses:[]};db.customers.forEach(r=>{if(!r.businessId)r.businessId='hvac'});db.equipment.forEach(r=>{if(!r.businessId)r.businessId='hvac'});db.services.forEach(r=>{if(!r.businessId)r.businessId='hvac'});db.invoices.forEach(r=>{if(!r.businessId)r.businessId='hvac'});save();}
function businessProfiles(){migrateOntario();const b=db.businesses;app.innerHTML='<h2>Canadian business profiles</h2><p class="note">Each corporation has its own legal name and GST/HST number. Existing HVAC records remain with the HVAC business. This release does not change historical invoice taxes or amounts.</p>'+b.map((x,i)=>`<form class="card businessForm" data-index="${i}"><h3>${i===0?'HVAC business':'Commercial property business'}</h3>${field('Legal business name','legalName',x.legalName,'text',true)}${field('Operating name','operatingName',x.operatingName)}${field('Phone','phone',x.phone,'tel')}${field('Email','email',x.email,'email')}${field('Address','address',x.address)}${field('GST/HST registration number','hstNumber',x.hstNumber)}<label><input type="checkbox" name="hstRegistered" ${x.hstRegistered?'checked':''}> Registered for GST/HST</label>${field('Default HST rate (%)','defaultHstRate',x.defaultHstRate,'number')}<button>Save business profile</button></form>`).join('')+'<p class="note">Ontario generally uses 13% HST on taxable supplies. Verify tax status and registration separately for each corporation. No automatic tax filing is included.</p>';document.querySelectorAll('.businessForm').forEach(f=>f.onsubmit=e=>{e.preventDefault();const i=Number(f.dataset.index),old=db.businesses[i],rate=Number(val(f,'defaultHstRate'));if(!Number.isFinite(rate)||rate<0||rate>100){alert('Enter a valid tax rate');return}const updated={...old,legalName:val(f,'legalName'),operatingName:val(f,'operatingName'),phone:val(f,'phone'),email:val(f,'email'),address:val(f,'address'),hstNumber:val(f,'hstNumber'),hstRegistered:f.elements.hstRegistered.checked,defaultHstRate:rate};if(!updated.legalName){alert('Legal name is required');return}db.businesses[i]=updated;save();alert('Profile saved. Existing invoices remain unchanged.');businessProfiles()})}
initializeStorage();
